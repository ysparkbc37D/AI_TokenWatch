<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="strokeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="gptGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#strokeBg)" stroke-width="3"/>

  <!-- Subtle concentric background tracks -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#13203c" stroke-width="24"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#0e172c" stroke-width="16"/>

  <!-- Multi-provider Quota Progress Rings -->
  <!-- Gemini Ring (Cyan) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#geminiGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="290 1105" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Claude Ring (Amber) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#claudeGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="220 1105" stroke-dashoffset="-380" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- ChatGPT Ring (Emerald) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gptGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="260 1105" stroke-dashoffset="-680" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Inner Token Pulse Core -->
  <circle cx="256" cy="256" r="88" fill="#0c162d" stroke="#233866" stroke-width="3"/>
  
  <!-- Stylized AI Token Spark / Diamond -->
  <path d="M256 196 L276 244 L316 256 L276 268 L256 316 L236 268 L196 256 L236 244 Z"
        fill="url(#geminiGrad)" filter="url(#glow)"/>
  
  <!-- Mini satellites -->
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  <circle cx="256" cy="144" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="368" cy="256" r="6" fill="#34d399" filter="url(#glow)"/>
  <circle cx="180" cy="350" r="6" fill="#f59e0b" filter="url(#glow)"/>
</svg>
